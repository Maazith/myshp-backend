# Docker Compose configuration for local PostgreSQL development
# This is OPTIONAL - only use if you want to run PostgreSQL in Docker

version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: myshp_postgres
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: myshp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d myshp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local










